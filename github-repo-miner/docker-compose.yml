version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: miner_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: miner_db
      POSTGRES_USER: miner_user
      POSTGRES_PASSWORD: miner_pass
    ports:
      - "5432:5432"
    volumes:
      - miner_pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: shared_catalog_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: catalog_user
      MONGO_INITDB_ROOT_PASSWORD: catalog_pass
      MONGO_INITDB_DATABASE: shared_catalog
    ports:
      - "27017:27017"
    volumes:
      - shared_catalog_data:/data/db

volumes:
  miner_pgdata:
  shared_catalog_data: